{% extends "admin/base.html" %}
{% block content %}
<h1>Categories</h1>
<form method="post" class="panel" style="display:flex;gap:8px;margin-bottom:16px;max-width:520px">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input name="name" placeholder="New category name" required><button class="btn">Add</button>
</form>
<div class="table-wrap" style="max-width:520px">
<table>
  <tr><th>Name</th><th>Products</th><th></th></tr>
  {% for c in cats %}
  <tr><td>{{ c.name }}</td><td>{{ c.products|length }}</td>
    <td><form method="post" action="{{ url_for('admin_category_delete', cid=c.id) }}" onsubmit="return confirm('Delete category? Products stay but lose the category.')">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn sm danger">Delete</button></form></td></tr>
  {% endfor %}
</table>
</div>
{% endblock %}
